<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amplr — Get Started</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a25;
      --border: #252535;
      --text: #f0f0f5;
      --text-2: #9999b0;
      --text-3: #666680;
      --blue: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --gradient: linear-gradient(120deg, #5B6FE8 0%, #9B5DE5 55%, #F368A8 100%);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; overflow-x: hidden;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .orb { position: fixed; border-radius: 50%; filter: blur(120px); opacity: .25; z-index: 0; pointer-events: none; }
    .orb-1 { width: 450px; height: 450px; background: #5B6FE8; top: -120px; right: -80px; }
    .orb-2 { width: 380px; height: 380px; background: #9B5DE5; bottom: -100px; left: -100px; }

    .auth-card {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
      background: rgba(18,18,26,.85); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }

    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 32px; text-decoration: none; }
    .auth-logo .brand-text { font-size: 22px; font-weight: 700; color: var(--text); }

    .auth-header { text-align: center; margin-bottom: 28px; }
    .auth-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 6px; }
    .auth-header p { font-size: 14px; color: var(--text-2); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-2); }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-family: inherit; background: var(--surface); color: var(--text);
      transition: border .15s, box-shadow .15s;
    }
    .form-group input:focus { outline: none; border-color: #5B6FE8; box-shadow: 0 0 0 3px rgba(91,111,232,.15); }
    .form-group input::placeholder { color: var(--text-3); }

    .auth-submit {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      background: var(--gradient); color: white; transition: transform .15s, box-shadow .15s;
      margin-top: 4px;
    }
    .auth-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(91,111,232,.3); }
    .auth-submit:active { transform: translateY(0); }

    .auth-toggle { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-3); }
    .auth-toggle a { color: #5B6FE8; font-weight: 600; cursor: pointer; text-decoration: none; }
    .auth-toggle a:hover { text-decoration: underline; }

    .auth-error {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #f87171;
      margin-bottom: 16px; display: none;
    }
    .auth-error.show { display: block; }

    .auth-footer { text-align: center; margin-top: 28px; font-size: 11px; color: var(--text-3); line-height: 1.5; }
    .auth-footer a { color: var(--text-3); text-decoration: none; }
    .auth-footer a:hover { color: var(--text-2); }

    .name-field { display: none; }
    .name-field.show { display: block; }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
      .auth-header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
        <defs><linearGradient id="sG" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#5B6FE8"/><stop offset="55%" stop-color="#9B5DE5"/><stop offset="100%" stop-color="#F368A8"/>
        </linearGradient></defs>
        <path d="M8 20 a8 8 0 1 1 8 8 L16 12 L16 28" stroke="url(#sG)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="16" y1="20" x2="28" y2="20" stroke="url(#sG)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="28" cy="12" r="3" fill="#F368A8"/>
        <circle cx="32" cy="20" r="3" fill="#F368A8"/>
        <circle cx="28" cy="28" r="3" fill="#F368A8"/>
      </svg>
      <span class="brand-text">amplr</span>
    </a>

    <div class="auth-header">
      <h1 id="authTitle">Create your account</h1>
      <p id="authSubtitle">Start posting to 50+ groups on autopilot.</p>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="authForm" onsubmit="return false">
      <div class="form-group name-field" id="nameField">
        <label>Name</label>
        <input type="text" id="authName" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="Create a password" autocomplete="new-password" required />
      </div>
      <button class="auth-submit" id="authSubmit" onclick="handleAuth()">Create Account</button>
    </form>

    <div class="auth-toggle" id="authToggle">
      Already have an account? <a onclick="toggleMode()">Sign in</a>
    </div>

    <div class="auth-footer">
      By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </div>
  </div>

  <script>
    let mode = 'signup';

    // Redirect if already authenticated
    if (localStorage.getItem('amplr_auth')) {
      window.location.href = 'dashboard.html';
    }

    function toggleMode() {
      mode = mode === 'signup' ? 'login' : 'signup';
      const isSignup = mode === 'signup';

      document.getElementById('authTitle').textContent = isSignup ? 'Create your account' : 'Welcome back';
      document.getElementById('authSubtitle').textContent = isSignup ? 'Start posting to 50+ groups on autopilot.' : 'Sign in to your dashboard.';
      document.getElementById('nameField').classList.toggle('show', isSignup);
      document.getElementById('authPassword').setAttribute('placeholder', isSignup ? 'Create a password' : 'Your password');
      document.getElementById('authPassword').setAttribute('autocomplete', isSignup ? 'new-password' : 'current-password');
      document.getElementById('authSubmit').textContent = isSignup ? 'Create Account' : 'Sign In';
      document.getElementById('authToggle').innerHTML = isSignup
        ? 'Already have an account? <a onclick="toggleMode()">Sign in</a>'
        : 'Don\'t have an account? <a onclick="toggleMode()">Create one</a>';

      document.getElementById('authError').classList.remove('show');
    }

    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('show');
    }

    function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !email.includes('@')) {
        showError('Enter a valid email address.');
        return;
      }
      if (password.length < 6) {
        showError(mode === 'signup' ? 'Password must be at least 6 characters.' : 'Enter your password.');
        return;
      }

      if (mode === 'signup') {
        const name = document.getElementById('authName').value.trim() || email.split('@')[0];
        localStorage.setItem('amplr_auth', JSON.stringify({
          name, email, createdAt: new Date().toISOString()
        }));
      } else {
        // Sign in — store session
        const existing = JSON.parse(localStorage.getItem('amplr_auth') || '{}');
        if (existing.email && existing.email !== email) {
          // Allow re-login with different email, overwrite
        }
        localStorage.setItem('amplr_auth', JSON.stringify({
          name: existing.name || email.split('@')[0],
          email, createdAt: existing.createdAt || new Date().toISOString()
        }));
      }

      window.location.href = 'dashboard.html';
    }

    // Enter key submits
    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      handleAuth();
    });
  </script>

</body>
</html>
